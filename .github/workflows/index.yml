name: Quality check

on:
  push:
    branches:
      - main

jobs:
  quality-check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: PHP-CS-Fixer
            command: composer csfixer
          - tool: Psalm
            command: composer psalm
          - tool: PHPStan
            command: composer phpStan
          - tool: Tests
            command: php bin/phpunit tests

    steps:
      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy default config
        run: cp .env.dist .env

      - name: Start containers
        run: docker-compose -f "docker-compose.yml" up -d --build

      - name: Composer install
        run: docker-compose -f "docker-compose.yml" exec -T fpm composer install

      - name: Yarn install
        run: docker-compose -f "docker-compose.yml" exec -T fpm yarn install

      - name: Build front end
        run: docker-compose -f "docker-compose.yml" exec -T fpm yarn encore dev

      - name: Add empty tables to the DB
        run: docker-compose -f "docker-compose.yml" exec -T fpm php bin/console doctrine:migrations:migrate

      - name: Run ${{ matrix.tool }}
        run: docker-compose -f "docker-compose.yml" exec -T fpm composer ${{ matrix.command }}

      - name: Stop containers
        if: always()
        run: docker-compose -f "docker-compose.yml" down